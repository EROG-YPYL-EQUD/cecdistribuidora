<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020617">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ERP Financeiro">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<title>ERP Financeiro - Sistema Integrado</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- ============================================================
     FIREBASE — Auth + Realtime Database
     Todos os dados são salvos em:
     /users/{uid}/{chave}  (ex: /users/abc123/despesas)
============================================================ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="js/firebase.js"></script>

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- LOADING / SAVING OVERLAY -->
<div id="login-loading">
  <div class="spinner"></div>
  <span id="loading-msg">Verificando sessão...</span>
</div>

<!-- TOAST SALVO -->
<div id="save-toast">✓ Salvo no Firebase</div>

<!-- TELA DE LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <h1>ERP Financeiro</h1>
    <p>Acesse sua conta para gerenciar seu negócio</p>
    <div class="login-input-group">
      <label>E-mail</label>
      <input type="email" id="login-email" placeholder="seu@email.com"
        onkeydown="if(event.key==='Enter') realizarLogin()">
    </div>
    <div class="login-input-group">
      <label>Senha</label>
      <input type="password" id="login-pass" placeholder="Sua senha"
        onkeydown="if(event.key==='Enter') realizarLogin()">
    </div>
    <button class="btn-login" id="btn-entrar" onclick="realizarLogin()">Entrar no Sistema</button>
    <p id="login-error" style="color:#ef4444; margin-top:15px; display:none; font-size:13px;"></p>
  </div>
</div>

<!-- SISTEMA PRINCIPAL -->
<div id="main-app">
  <div id="global-greeting" class="greeting-bar" style="margin:20px; border-radius:15px;"></div>

  <div class="main-nav">
    <div class="nav-tabs-container">
      <div id="tab-dashboard" class="nav-tab" onclick="mudarAba('dashboard')">Dashboard</div>
      <div id="tab-gestao" class="nav-tab" onclick="mudarAba('gestao')">Gestão Financeira</div>
    </div>
    <div class="nav-actions">
      <span class="firebase-badge">🔥 Firebase</span>
      <div class="config-btn" onclick="abrirConfiguracoes()">Configurações</div>
      <div class="logout-btn" onclick="realizarLogout()">Sair</div>
    </div>
  </div>

  <div id="submenu-dashboard" class="submenu">
    <button id="btn-dash-geral"      class="menu-btn" onclick="abrirDash('geral')">Geral</button>
    <button id="btn-dash-comissoes"  class="menu-btn" onclick="abrirDash('comissoes')">Comissões</button>
    <button id="btn-dash-fluxo"      class="menu-btn" onclick="abrirDash('fluxo')">Fluxo de Caixa</button>
    <button id="btn-dash-dre"        class="menu-btn" onclick="abrirDash('dre')">DRE</button>
  </div>

  <div id="submenu-gestao" class="submenu">
    <button id="btn-contas"       class="menu-btn" onclick="abrirTela('contas')">Contas</button>
    <button id="btn-clientes"     class="menu-btn" onclick="abrirTela('clientes')">Clientes</button>
    <button id="btn-fornecedores" class="menu-btn" onclick="abrirTela('fornecedores')">Fornecedores</button>
    <button id="btn-vendedores"   class="menu-btn" onclick="abrirTela('vendedores')">Vendedores</button>
    <button id="btn-despesas"     class="menu-btn" onclick="abrirTela('despesas')">Despesas</button>
    <button id="btn-receitas"     class="menu-btn" onclick="abrirTela('receitas')">Receitas</button>
  </div>

  <div id="conteudo"></div>
</div>

<!-- MODAL -->
<div id="modal">
  <div class="modal-box"><div id="modal-body"></div></div>
</div>

<script src="js/core.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/gestao.js"></script>
<script src="js/despesas.js"></script>
<script src="js/receitas.js"></script>

<script src="js/bootstrap.js"></script>

<script src="js/session-fallback.js"></script>

<script src="js/service-worker-register.js"></script>
</body>
</html>
